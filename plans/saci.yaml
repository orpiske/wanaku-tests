# Configuration for the Saci that runs the self-test plans in test/plans/
# against a second Saci, the one test/start-under-test.sh starts on
# 127.0.0.1:18080. This one listens on 127.0.0.1:8080 and needs a real,
# tool-capable model. Reference: docs/configuration.md, test/README.md.

backend:
  listen: 0.0.0.0:18080
  data_dir: ./saci-self-test-data
  # Workers share the host's network, so loopback reaches this backend and
  # the backend under test.
  worker_url: http://host.docker.internal:18080
  auth:
    token_env: SACI_BACKEND_TOKEN

worker:
  runtime: auto            # podman if found in PATH, otherwise docker
  image: quay.io/wanaku/wanaku-saci-worker:latest
  network: host
  image_pull_policy: Always

llm:
  base_url: env:SACI_LLM_BASE_URL
  model: rits/zai-org/glm-5-3
  api_key: env:SACI_LLM_API_KEY

judge:
  provider: julia-1
  endpoint: http://host.containers.internal:8095/v1/evaluate
  api_key: env:SACI_BACKEND_TOKEN

limits:
  run_timeout_secs: 7200
  step_timeout_secs: 300

environments:
  builtin:
    description: Tests a Wanaku instance running on the host
    parameters:
      WANAKU_SERVER_MODE: builtin
  wanaku-local-existing:
    description: Tests a Wanaku instance running on the host
    parameters:
      # Run it like this: podman run -p 28180:8080 -p 28181:8081 quay.io/wanaku/wanaku-server:latest
      WANAKU_SERVER_URL: http://host.docker.internal:28180
      WANAKU_MCP_BASE_URL: http://host.docker.internal:28181
      WANAKU_SERVER_MODE: existing
      # Run it like this: podman run -p 38181:8181 quay.io/wanaku/test-mcp-server
      TEST_MCP_URL: http://host.docker.internal:38181
  openshift:
    description: Tests Wanaku on OpenShift
    parameters:
      OPENSHIFT_SA_TOKEN: env:OPENSHIFT_SA_TOKEN
      OPENSHIFT_API_URL: env:OPENSHIFT_API_URL
  investigator:
    secrets:
      GIT_TOKEN:
        env: GH_TOKEN      # read code and create issues only

# NOTE: this requires the saci script runner with the MCP scripts for tools.
# Comment this block if you don't have it.
actions:
  servers:
    mailer:
      url: http://127.0.0.1:58081/saci-ns/mcp
  definitions:
    email-report:
      server: mailer
      tool: send-email
      on: [passed, failed, blocked, inconclusive, error, cancelled]
      arguments:
        run_id: "{{run.id}}"
        title: "{{plan.title}}"
        outcome: "{{run.outcome}}"
        reason: "{{run.reason}}"
        finished_at: "{{run.finished_at}}"
        counts: "{{run.counts}}"
        summary: "Units:\n{{summary}}"
        x-request-id: "{{run.id}}"

investigations:
  environment: investigator
  image: quay.io/wanaku/wanaku-saci-worker:latest
  repositories:
    - name: wanaku
      url: https://github.com/wanaku-ai/wanaku.git
      ref: main
      description: The Wanaku Governed Action Proxy repository
    - name: wanaku-barn
      url: https://github.com/wanaku-ai/wanaku-barn.git
      ref: main
      description: A collection of utilities for the Wanaku Governed Action Proxy
    - name: camel-integration-capability
      url: https://github.com/wanaku-ai/camel-integration-capability.git
      ref: main
      description: A capability service for the Wanaku Governed Action Proxy that enables AI agents to interact with backend systems through dynamically executed Apache Camel routes.
  prepare:
    - 'ripwire . --for="{{failure.title}}: {{failure.reason}}" --token-budget=4000'
  instructions: |
    File bugs in wanaku-ai/wanaku. Search for an open issue first.
  limits:
    run_timeout_secs: 1800
    output_limit_bytes: 8192

policies:
  default:
    actions: [email-report]